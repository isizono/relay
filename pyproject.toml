[project]
name = "relay"
version = "0.1.0"
description = "別々の人間が使う Claude Code 同士に認識合わせを代行させる、履歴を持つ軽量メッセージング中継（A2A 準拠 HTTP サーバー + Python SDK）"
requires-python = ">=3.11"
license = "MIT"
# httpx は relay_sdk（クライアント側 SDK）が import 時に必須とする runtime dependency
# （publisher/subscriber の HTTP・SSE 通信の実体）であり、dev-only ではない。
dependencies = [
    "authlib>=1.7.2",
    "httpx>=0.28.1",
    "joserfc>=1.7.2",
    "rfc8785>=0.1.4",
    "sse-starlette>=3.4.4",
    "starlette>=1.2.1",
    "uvicorn>=0.48.0",
    "yoyo-migrations>=9.0.0",
]

[dependency-groups]
# pyjwt は tests/test_sdk_auth.py が JWT claim 検証（jwt.decode）に使う test-only 依存。
dev = ["pyjwt>=2.13.0", "pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["relay", "relay_sdk"]
